
<section class="history-page">

  <div class="page-heading">
    <div>
      <h1>Resume History</h1>
      <p>Manage and track all analyzed candidate resumes.</p>
    </div>

    <button class="export-btn">Export Data</button>
  </div>

  <!-- Summary Cards -->
  <div class="stats-grid">

    <div class="stat-card">
      <span>Total Candidates</span>
      <h2>0</h2>
      <small>All uploaded resumes</small>
    </div>

    <div class="stat-card qualified">
      <span>Qualified</span>
      <h2>0</h2>
      <small>Score 75 or above</small>
    </div>

    <div class="stat-card rejected">
      <span>Not Qualified</span>
      <h2>0</h2>
      <small>Score below 75</small>
    </div>

  </div>

  <!-- Candidate Table -->
  <div class="table-card">

    <div class="table-heading">
      <div>
        <h2>Candidate Records</h2>
        <p>Review AI-analyzed resumes.</p>
      </div>
    </div>

    <div class="toolbar">
      <input
        type="text"
        placeholder="Search candidates..."
      />

      <select>
        <option>All Candidates</option>
        <option>Qualified</option>
        <option>Not Qualified</option>
      </select>
    </div>

    <div class="empty-state">
      <h3>No candidates found</h3>
      <p>Uploaded and analyzed resumes will appear here.</p>
    </div>

  </div>

</section>
